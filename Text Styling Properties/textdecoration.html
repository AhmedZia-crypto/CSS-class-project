<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Styling</title>
    <style>
        #c1{
            text-decoration: overline;
        } 
        #c2{
            text-decoration: underline;
        }
        #c3{
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <h1 id="c1">Hello</h1>
    <h1 id="c2">School</h1>
    <h1 id="c3">Vacation</h1>
</body>
</html>
